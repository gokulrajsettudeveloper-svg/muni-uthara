<div class="music-player">
  <audio #audioRef (ended)="onEnded()" preload="auto"></audio>

  @if (needsEnable()) {
    <button class="music-enable" (click)="enableSound()" data-aos="fade-left">
      <i class="bi bi-music-note-beamed"></i> Tap to Enable Music
    </button>
  }

  <button
    class="music-toggle"
    [class.on]="isOn()"
    (click)="toggle()"
    [title]="isOn() ? 'Music on — tap to mute' : 'Music off — tap to play'"
    [attr.aria-label]="isOn() ? 'Turn music off' : 'Turn music on'">
    <i class="bi" [class.bi-disc-fill]="isOn()" [class.bi-volume-mute-fill]="!isOn()"></i>
  </button>
</div>
