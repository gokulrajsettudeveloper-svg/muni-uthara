<div class="music-player" [class.expanded]="isExpanded()">
  <audio
    #audioRef
    [src]="trackUrl"
    (timeupdate)="onTimeUpdate()"
    (ended)="onEnded()"
    loop="false"
    preload="metadata">
  </audio>

  <button class="toggle-btn" (click)="toggleExpand()" [class.spinning]="isPlaying()">
    <i class="bi bi-vinyl-fill"></i>
  </button>

  @if (isExpanded()) {
    <div class="player-panel" data-aos="fade-up">
      <p class="track-title">{{ trackTitle }}</p>

      <div class="controls">
        <button class="play-btn" (click)="togglePlay()">
          <i class="bi" [class.bi-play-fill]="!isPlaying()" [class.bi-pause-fill]="isPlaying()"></i>
        </button>

        <input
          type="range"
          class="progress-bar"
          min="0"
          max="100"
          [value]="progress()"
          (input)="seek($event)">
      </div>

      <div class="volume-row">
        <i class="bi bi-volume-down-fill"></i>
        <input
          type="range"
          class="volume-bar"
          min="0"
          max="1"
          step="0.05"
          [value]="volume()"
          (input)="setVolume($event)">
        <i class="bi bi-volume-up-fill"></i>
      </div>
    </div>
  }
</div>
