<section class="gallery-section" id="gallery">
  <!-- Heart photo-frame + butterfly ornaments -->
  <svg class="ornament ornament-heart-frame" viewBox="0 0 100 90" aria-hidden="true">
    <path class="heart-frame-outer" d="M50,82 C22,62 6,44 6,26 C6,10 20,2 32,9 C40,14 50,26 50,26 C50,26 60,14 68,9 C80,2 94,10 94,26 C94,44 78,62 50,82 Z" />
    <path class="heart-frame-inner" d="M50,72 C28,56 15,42 15,27 C15,15 25,9 34,14 C41,18 50,27 50,27 C50,27 59,18 66,14 C75,9 85,15 85,27 C85,42 72,56 50,72 Z" />
  </svg>

  <svg class="ornament ornament-butterfly" viewBox="0 0 100 80" aria-hidden="true">
    <g class="butterfly-wings">
      <path class="wing wing-left" d="M48,40 C20,10 0,20 4,42 C0,64 24,72 48,44 Z" />
      <path class="wing wing-right" d="M52,40 C80,10 100,20 96,42 C100,64 76,72 52,44 Z" />
    </g>
    <line class="butterfly-body" x1="50" y1="20" x2="50" y2="62" />
  </svg>

  <div class="container">
    <h2 class="section-title text-center" appReveal="fade">Our Gallery</h2>

    <div class="filter-chips text-center" appReveal="fade" [revealDelay]="0.1">
      @for (cat of categories; track cat) {
        <button
          class="chip"
          [class.active]="activeCategory() === cat"
          (click)="setCategory(cat)">
          {{ cat }}
        </button>
      }
    </div>

    <div class="gallery-grid mt-4">
      @for (img of filtered; track img.url; let i = $index) {
        <div class="gallery-item" appTilt3d (click)="open(img)">
          <div class="gallery-item-inner" [style.--float-delay.s]="(i % 5) * 0.4">
            <img [src]="img.url" [alt]="img.caption" loading="lazy">
            <div class="overlay">
              <i class="bi bi-zoom-in"></i>
              <span>{{ img.caption }}</span>
            </div>
          </div>
        </div>
      }
    </div>
  </div>

  <div class="lightbox" [class.open]="!!lightboxImage()" (click)="close()" [attr.aria-hidden]="!lightboxImage()">
    <button class="close-btn" (click)="close()"><i class="bi bi-x-lg"></i></button>
    <img [src]="lightboxImage()?.url ?? ''" [alt]="lightboxImage()?.caption ?? ''" (click)="$event.stopPropagation()">
    <p class="caption">{{ lightboxImage()?.caption }}</p>
  </div>
</section>
