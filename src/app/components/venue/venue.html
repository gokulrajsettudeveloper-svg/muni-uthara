<section class="venue-section" id="venue">
  <div class="container">
    <h2 class="section-title text-center" appReveal="fade">Wedding Venue</h2>

    <div class="row g-4 align-items-center mt-3">
      <div class="col-lg-5" appReveal="parallax">
        <div class="venue-info glass-island">
          <div class="map-pin" aria-hidden="true">
            <i class="bi bi-geo-alt-fill"></i>
          </div>

          <svg class="route-line" viewBox="0 0 200 40" aria-hidden="true" preserveAspectRatio="none">
            <path d="M4,34 C40,4 80,34 120,10 C150,-6 180,20 196,6" />
          </svg>

          <h3>{{ venue.name }}</h3>
          <p class="address"><i class="bi bi-geo-alt-fill"></i> {{ venue.address }}</p>
          <a [href]="venue.mapDirectionsUrl" target="_blank" rel="noopener" class="btn btn-directions">
            <i class="bi bi-signpost-2-fill"></i> Get Directions
          </a>
        </div>
      </div>
      <div class="col-lg-7" appReveal="fade">
        <div class="map-wrap glass-island">
          <iframe
            [src]="safeMapUrl"
            width="100%"
            height="380"
            style="border:0;"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>
    </div>
  </div>
</section>
