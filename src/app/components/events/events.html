<section class="events-section" id="events">
  <div class="container">
    <h2 class="section-title text-center" data-aos="fade-up">Event Schedule</h2>

    <div class="row g-4 mt-3">
      @for (event of events; track event.title; let i = $index) {
        <div class="col-sm-6 col-lg-3" data-aos="fade-up" [attr.data-aos-delay]="i * 100">
          <div class="event-card">
            <div class="icon-wrap">
              <i [class]="'bi ' + event.icon"></i>
            </div>
            <h3>{{ event.title }}</h3>
            <p class="datetime">{{ event.date }} &bull; {{ event.time }}</p>
            <p class="description">{{ event.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
