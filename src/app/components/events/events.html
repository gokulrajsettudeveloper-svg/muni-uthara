<section class="events-section" id="events">
  <div class="container">
    <h2 class="section-title text-center" appReveal="fade">Event Schedule</h2>

    <div class="row g-4 mt-3">
      @for (event of events; track event.title; let i = $index) {
        <div class="col-sm-6 col-lg-3" appReveal="fade" [revealDelay]="i * 0.1">
          <div class="event-card" appTilt3d>
            <div class="icon-wrap">
              <i [class]="'bi ' + event.icon"></i>
            </div>
            <h3>{{ event.title }}</h3>
            <p class="datetime">{{ event.date }} &bull; {{ event.time }}</p>
            <p class="description">{{ event.description }}</p>

            @if (event.venue) {
              <p class="event-venue">
                <i class="bi bi-geo-alt-fill"></i>
                <span>
                  <strong>{{ event.venue }}</strong>
                  @if (event.address) {
                    <br />{{ event.address }}
                  }
                </span>
              </p>
              <a class="directions-link" [href]="directionsUrl(event)" target="_blank" rel="noopener">
                <i class="bi bi-signpost-2-fill"></i> Get Directions
              </a>
            }
          </div>
        </div>
      }
    </div>
  </div>
</section>
