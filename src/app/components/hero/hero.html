<section class="hero" id="hero">
  <!-- Full-bleed couple photo behind the whole poster -->
  <img class="hero-photo" [src]="couple.heroImage"
       alt="{{ couple.groom.name.split(' ')[0] }} & {{ couple.bride.name.split(' ')[0] }}" />

  <!-- Invitation sits in a translucent glass panel, framed with floral accents -->
  <div class="hero-content text-center" data-aos="zoom-in" data-aos-duration="1200">
    <h1 class="hero-invited">You're Invited</h1>
    <p class="hero-subtitle">To Our Wedding</p>
    <p class="hero-names">
      {{ couple.groom.name.split(' ')[0] }} &amp; {{ couple.bride.name.split(' ')[0] }}
    </p>
    <p class="hero-date">{{ couple.weddingDate | date: 'dd . MM . yyyy' }}</p>
    <button class="btn btn-invite" (click)="scrollToInvite()">
      <i class="bi bi-heart-fill"></i> Open Invitation
    </button>
  </div>

  <div class="scroll-cue" data-aos="fade-up" data-aos-delay="800">
    <i class="bi bi-chevron-down"></i>
  </div>
</section>
