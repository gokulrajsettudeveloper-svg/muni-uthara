<section class="hero" id="hero">
  <!-- Full-bleed couple photo behind the whole poster -->
  <img class="hero-photo" [src]="couple.heroImage"
       alt="{{ couple.groom.name.split(' ')[0] }} &amp; {{ couple.bride.name.split(' ')[0] }}" />

  @if (!isConstrainedDevice()) {
    @defer (on viewport) {
      <app-hero-scene></app-hero-scene>
    } @placeholder {
      <span></span>
    }
  }

  <app-particle-field class="hero-fireflies" preset="fireflies" density="low"></app-particle-field>
  <app-particle-field class="hero-petals" preset="petals" density="low"></app-particle-field>

  <!-- The invitation sits in a translucent "crystal" glass panel, framed with floral accents -->
  <div class="hero-content text-center" appTilt3d appReveal="zoom" [revealDuration]="1.2">
    <h1 class="hero-invited">You're Invited</h1>
    <p class="hero-subtitle">To Our Wedding</p>
    <p class="hero-names">
      {{ couple.groom.name.split(' ')[0] }} &amp; {{ couple.bride.name.split(' ')[0] }}
    </p>
    <p class="hero-date">{{ couple.weddingDate | date: 'dd . MM . yyyy' }}</p>

    <app-countdown class="hero-countdown" [targetDate]="couple.weddingDate"></app-countdown>

    <button class="btn btn-invite" (click)="scrollToInvite()">
      <i class="bi bi-heart-fill"></i> Open Invitation
    </button>
  </div>

  <div class="scroll-cue" appReveal="fade" [revealDelay]="0.8">
    <i class="bi bi-chevron-down"></i>
  </div>
</section>
