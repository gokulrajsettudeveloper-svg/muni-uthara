<footer class="site-footer">
  <app-particle-field class="footer-stars" preset="stars" density="low"></app-particle-field>
  <app-particle-field class="footer-lanterns" preset="lanterns" density="low"></app-particle-field>

  <!-- White doves + balloons drifting through the night sky -->
  <svg class="ornament ornament-dove ornament-dove-a" viewBox="0 0 80 50" aria-hidden="true">
    <path class="dove-wing" d="M40,30 C20,8 2,14 8,26 C16,24 28,26 38,34 Z" />
    <path class="dove-wing" d="M40,30 C60,8 78,14 72,26 C64,24 52,26 42,34 Z" />
    <path class="dove-body" d="M32,32 C32,24 40,20 46,26 C50,30 48,38 40,40 C34,42 30,38 32,32 Z" />
  </svg>

  <svg class="ornament ornament-dove ornament-dove-b" viewBox="0 0 80 50" aria-hidden="true">
    <path class="dove-wing" d="M40,30 C20,8 2,14 8,26 C16,24 28,26 38,34 Z" />
    <path class="dove-wing" d="M40,30 C60,8 78,14 72,26 C64,24 52,26 42,34 Z" />
    <path class="dove-body" d="M32,32 C32,24 40,20 46,26 C50,30 48,38 40,40 C34,42 30,38 32,32 Z" />
  </svg>

  <svg class="ornament ornament-balloons" viewBox="0 0 100 160" aria-hidden="true">
    <line class="balloon-string" x1="28" y1="60" x2="20" y2="150" />
    <ellipse class="balloon balloon-a" cx="28" cy="34" rx="22" ry="28" />
    <line class="balloon-string" x1="70" y1="46" x2="76" y2="140" />
    <ellipse class="balloon balloon-b" cx="70" cy="24" rx="17" ry="22" />
  </svg>

  <div class="container text-center">
    <span class="footer-monogram">M &amp; U</span>

    <p class="footer-message">Every love story is beautiful,<br />but ours is our favorite.</p>

    <div class="social-icons mb-3">
      <a [href]="instagramLink" target="_blank" rel="noopener" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
      <a [href]="facebookLink" target="_blank" rel="noopener" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
      <a [href]="whatsappLink" target="_blank" rel="noopener" aria-label="WhatsApp"><i class="bi bi-whatsapp"></i></a>
    </div>
    <p class="made-with">Made With <i class="bi bi-heart-fill"></i> By {{ createdBy }}</p>
    <p class="copyright">&copy; {{ year }} All Rights Reserved</p>
  </div>
</footer>
