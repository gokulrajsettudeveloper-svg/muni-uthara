<section class="story-section" id="story">
  <!-- Pearl string + diamond ornaments, corner-anchored -->
  <svg class="ornament ornament-pearls" viewBox="0 0 60 220" aria-hidden="true">
    <path class="pearl-string" d="M30,0 C10,40 50,80 30,120 C10,160 50,190 30,220" />
    <circle class="pearl" cx="30" cy="14" r="7" />
    <circle class="pearl" cx="38" cy="48" r="6" />
    <circle class="pearl" cx="24" cy="82" r="7" />
    <circle class="pearl" cx="36" cy="116" r="6" />
    <circle class="pearl" cx="22" cy="150" r="7" />
    <circle class="pearl" cx="34" cy="184" r="6" />
    <circle class="pearl" cx="28" cy="214" r="7" />
  </svg>

  <svg class="ornament ornament-diamonds" viewBox="0 0 140 140" aria-hidden="true">
    <path class="diamond diamond-a" d="M40,10 L60,30 L40,70 L20,30 Z" />
    <path class="diamond-shine diamond-a-shine" d="M40,10 L60,30 L40,34 Z" />
    <path class="diamond diamond-b" d="M95,50 L110,64 L95,92 L80,64 Z" />
  </svg>

  <div class="container">
    <h2 class="section-title text-center d-block" appReveal="fade">Our Timeline</h2>

    <div class="heart-timeline-wrap" #svgWrap>
      <app-particle-field #particleField class="story-particles" preset="sparkles" density="low"></app-particle-field>

      <svg class="heart-timeline" viewBox="0 0 340 340" role="img" aria-label="Our love story, as a heart-shaped timeline">
        <defs>
          <linearGradient id="heartLineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" class="stop-a" />
            <stop offset="50%" class="stop-b" />
            <stop offset="100%" class="stop-c" />
          </linearGradient>
          <radialGradient id="orbGlowGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" class="glow-a" />
            <stop offset="100%" class="glow-b" />
          </radialGradient>
        </defs>

        <path class="heart-line" [attr.d]="pathD" />

        @for (point of positioned; track point.milestone.title) {
          <g
            #orbGroup
            class="story-orb"
            [class.active]="activeIndex() === point.index"
            [attr.transform]="'translate(' + point.x + ',' + point.y + ')'"
            (click)="selectMilestone(point.index)"
            (keydown.enter)="selectMilestone(point.index)"
            tabindex="0"
            role="button"
            [attr.aria-label]="point.milestone.title + ', ' + point.milestone.date"
          >
            <circle class="orb-glow" r="22"></circle>
            <circle class="orb-core" r="11"></circle>

            <foreignObject x="-11" y="-11" width="22" height="22">
              <div class="orb-icon" xmlns="http://www.w3.org/1999/xhtml">
                <i class="bi {{ point.milestone.icon }}"></i>
              </div>
            </foreignObject>

            <foreignObject class="orb-card" [attr.x]="point.cardOffsetX" y="16" width="144" height="72">
              <div class="orb-card-inner" xmlns="http://www.w3.org/1999/xhtml">
                <strong>{{ point.milestone.title }}</strong>
                <span>{{ point.milestone.date }}</span>
              </div>
            </foreignObject>
          </g>
        }
      </svg>
    </div>
  </div>
</section>
