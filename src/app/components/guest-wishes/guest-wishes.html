<section class="wishes-section" id="wishes">
  <!-- Love letter with wax seal + floral vine ornaments -->
  <svg class="ornament ornament-love-letter" viewBox="0 0 110 80" aria-hidden="true">
    <rect class="letter-body" x="6" y="10" width="98" height="64" rx="4" />
    <path class="letter-flap" d="M6,10 L55,48 L104,10 Z" />
    <circle class="wax-seal" cx="55" cy="48" r="15" />
    <text class="wax-monogram" x="55" y="53" text-anchor="middle">M&amp;U</text>
  </svg>

  <svg class="ornament ornament-vine" viewBox="0 0 60 200" aria-hidden="true">
    <path class="vine-stem" d="M30,0 C10,30 50,60 30,90 C10,120 50,150 30,200" />
    <path class="vine-leaf" d="M30,30 C42,26 48,36 40,44 C32,42 26,36 30,30 Z" />
    <path class="vine-leaf" d="M30,80 C18,76 12,86 20,94 C28,92 34,86 30,80 Z" />
    <path class="vine-leaf" d="M30,140 C42,136 48,146 40,154 C32,152 26,146 30,140 Z" />
  </svg>

  <div class="container">
    <h2 class="section-title text-center" appReveal="fade">Wishes</h2>

    <div class="row g-4 mt-3">
      <div class="col-lg-5" appReveal="fade">
        <div class="wish-form">
          <input
            type="text"
            placeholder="Your Name"
            [(ngModel)]="name"
            name="wishName">
          <textarea
            rows="4"
            placeholder="Your Wishes..."
            [(ngModel)]="message"
            name="wishMessage"></textarea>
          <button class="btn-submit" (click)="submit()" [disabled]="!canSubmit">
            Submit Wish
          </button>
        </div>
      </div>

      <div class="col-lg-7" appReveal="fade" [revealDelay]="0.1">
        <div class="wish-list">
          @for (wish of wishes(); track wish.date + wish.name) {
            <div class="wish-card">
              <p class="wish-quote">"{{ wish.message }}"</p>
              <p class="wish-meta">{{ wish.name }} &bull; {{ wish.date }}</p>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</section>
