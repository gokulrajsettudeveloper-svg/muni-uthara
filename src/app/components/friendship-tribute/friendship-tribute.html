<section class="tribute-section" id="tribute">
  <div class="container">
    <h2 class="section-title text-center d-block" appReveal="fade">A Gift From Your Friend</h2>
    <p class="section-subtitle text-center" appReveal="fade" [revealDelay]="0.1">
      With love, {{ friendName }}
    </p>

    <div class="tribute-card" appReveal="zoom" [revealDelay]="0.15">
      <div class="photo-wrap">
        <img [src]="photo" [alt]="'Me and ' + friendName" loading="lazy">
      </div>
      <p class="tribute-message">{{ message }}</p>
      <span class="tribute-sign">{{ friendName }}</span>
    </div>
  </div>
</section>
